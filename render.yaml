services:
  # Backend API Service
  - type: web
    name: medxperts-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node Backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://medxperts-frountend.onrender.com
      - key: N8N_WEBHOOK_URL_MCP
        sync: false
      - key: N8N_WEBHOOK_URL_LCP
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # Frontend Service
  - type: web
    name: medxperts-frountend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://medxperts-ui.onrender.com
      - key: FRONTEND_URL
        value: https://medxperts-frountend.onrender.com
      - key: VITE_N8N_WEBHOOK_URL_MCP
        sync: false
      - key: VITE_N8N_WEBHOOK_URL_LCP
        sync: false
      - key: VITE_AWS_REGION
        sync: false
      - key: VITE_AWS_ACCESS_KEY_ID
        sync: false
      - key: VITE_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: VITE_S3_BUCKET_NAME
        sync: false
      - key: REACT_APP_FIREBASE_API_KEY
        sync: false
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: REACT_APP_FIREBASE_PROJECT_ID
        sync: false
      - key: REACT_APP_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: REACT_APP_FIREBASE_APP_ID
        sync: false
      - key: REACT_APP_FIREBASE_MEASUREMENT_ID
        sync: false
